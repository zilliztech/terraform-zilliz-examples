name: Terraform Validation

on:
  pull_request:
    branches:
      - master

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:      
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Configure Terraform plugin cache
        run: |
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >>"$GITHUB_ENV"
          mkdir --parents "$HOME/.terraform.d/plugin-cache"
      
      - name: Cache Terraform Plugin
        uses: actions/cache@v4
        with:
          path: |
            ~/.terraform.d/plugin-cache
          key: terraform-${{ runner.os }}-plugin-cache
          restore-keys: |
            terraform-${{ runner.os }}-plugin-cache
      
      - name: Terraform Validate in All Modules
        run: |
          export TF_PLUGIN_CACHE_DIR="${HOME}/.terraform.d/plugin-cache"
          for dir in modules/*; do
            if [ -d "$dir" ]; then
              echo "Validating $dir"
              cd "$dir"
              terraform init
              terraform validate
              cd -
            fi
          done
  gcp-cmek-storage:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - modules/gcp_byoc_i/gke
          - modules/gcp_byoc_i/pd-kms
          - modules/gcp_byoc_i/gcs
          - modules/gcp_byoc_i/booter-vm
          - examples/gcp-project-byoc-I
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest
      - name: Match the GCP example provider version
        if: matrix.directory != 'examples/gcp-project-byoc-I'
        run: |
          cat > ci-providers_override.tf <<'HCL'
          terraform {
            required_providers {
              google = {
                source  = "hashicorp/google"
                version = "~> 6.48.0"
              }
            }
          }
          HCL
      - run: terraform init -backend=false
      - run: terraform validate
      - name: Run offline mock tests
        run: |
          if [ -d tests ]; then
            terraform test
          fi
